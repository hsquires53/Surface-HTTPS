// Compute least-squares affine fit for NE region (pure JS, no dependencies)
function fitAffine2D(anchors) {
    // Solves for [a, b, c, d, e, f] in:
    //   pixelY = a*gameX + b*gameY + c
    //   pixelX = d*gameX + e*gameY + f
    // Using normal equations: X^T X beta = X^T y
    const n = anchors.length;
    const X = [], yY = [], yX = [];
    for (const pt of anchors) {
        const [gx, gy] = pt.game;
        X.push([gx, gy, 1]);
        yY.push(pt.pixel[0]);
        yX.push(pt.pixel[1]);
    }
    function transpose(A) {
        return A[0].map((_, i) => A.map(row => row[i]));
    }
    function multiply(A, B) {
        return A.map(row => B[0].map((_, j) => row.reduce((sum, v, i) => sum + v * B[i][j], 0)));
    }
    function invert3x3(m) {
        const [a, b, c] = m[0];
        const [d, e, f] = m[1];
        const [g, h, i] = m[2];
        const A = e*i - f*h, B = c*h - b*i, C = b*f - c*e;
        const D = f*g - d*i, E = a*i - c*g, F = c*d - a*f;
        const G = d*h - e*g, H = b*g - a*h, I = a*e - b*d;
        const det = a*A + b*D + c*G;
        if (Math.abs(det) < 1e-12) return null;
        return [
            [A/det, B/det, C/det],
            [D/det, E/det, F/det],
            [G/det, H/det, I/det]
        ];
    }
    function solve3x3(A, b) {
        const invA = invert3x3(A);
        if (!invA) return [0,0,0];
        return invA.map(row => row[0]*b[0] + row[1]*b[1] + row[2]*b[2]);
    }
    // Compute (X^T X) and (X^T y)
    const XT = transpose(X);
    const XTX = multiply(XT, X);
    const XTyY = XT.map(row => row.reduce((sum, v, i) => sum + v * yY[i], 0));
    const XTyX = XT.map(row => row.reduce((sum, v, i) => sum + v * yX[i], 0));
    const betaY = solve3x3(XTX, XTyY);
    const betaX = solve3x3(XTX, XTyX);
    // Return [a, b, c, d, e, f]
    return [betaY[0], betaY[1], betaY[2], betaX[0], betaX[1], betaX[2]];
}

const NE_AFFINE = fitAffine2D(NE_ANCHORS);

function gameToPixel(gameX, gameY, region) {
    // Use Gerudo region-specific calibration if region is 'Gerudo' or id starts with 'GE-'
    if (region === 'Gerudo' || (typeof region === 'undefined' && typeof gameX === 'string' && gameX.startsWith('GE-'))) {
        const [a, b, c, d, e, f] = GERUDO_AFFINE;
        const pixelY = a * gameX + b * gameY + c;
        const pixelX = d * gameX + e * gameY + f;
        return [pixelY, pixelX];
    }
    // Use NE region-specific calibration if region is 'Necluda' or id starts with 'NE-'
    if (region === 'Necluda' || (typeof region === 'undefined' && typeof gameX === 'string' && gameX.startsWith('NE-'))) {
        const [a, b, c, d, e, f] = NE_AFFINE;
        const pixelY = a * gameX + b * gameY + c;
        const pixelX = d * gameX + e * gameY + f;
        return [pixelY, pixelX];
    }
    // Use LA region-specific calibration if region is 'Lanayru' or id starts with 'LA-'
    // (If you have LA_AFFINE, add similar logic here)
    // Otherwise, use the original global calibration for all other regions
    // Reference points from the map:
    // Center:       HR-465 game [-254, 424] -> pixel [-1326, 1608]
    // Top Left:     HE-62  game [-4429, 3684] -> pixel [-236, 347]
    // Top Right:    AK-629 game [4541, 3162] -> pixel [-396, 3035]
    // Bottom Right: NE-880 game [4536, -3664] -> pixel [-2434, 3042]
    // Bottom Left:  GE-220 game [-4909, -1246] -> pixel [-2350, 325]
    const ref1GameX = -4429;  // HE-62 (Top Left)
    const ref1GameY = 3684;
    const ref1PixelX = 347;
    const ref1PixelY = -236;
    const ref2GameX = 4541;   // AK-629 (Top Right)
    const ref2GameY = 3162;
    const ref2PixelX = 3035;
    const ref2PixelY = -396;
    const xScale = (ref2PixelX - ref1PixelX) / (ref2GameX - ref1GameX);
    const yScale = (ref2PixelY - ref1PixelY) / (ref2GameY - ref1GameY);
    const pixelX = Math.round(ref1PixelX + (gameX - ref1GameX) * xScale);
    const pixelY = Math.round(ref1PixelY + (gameY - ref1GameY) * yScale);
    return [pixelY, pixelX];
}

function processKorokData(korok) {
    return {
        id: korok.id,
        coordinates: gameToPixel(korok.gameX, korok.gameY, korok.region),
        found: korok.found || false,
        region: korok.region || korok.id.split('-')[0],
        location: korok.location || '',
        puzzleType: korok.puzzleType || '',
        description: korok.description || `Game coordinates: [${korok.gameX}, ${korok.gameY}]`
    };
}

// Update the popup content to include new metadata
function createPopupContent(k) {
    if (!k.coordinates) {
        console.warn('Missing coordinates for marker:', k);
    }
    const popup = document.createElement('div');
    popup.className = 'korok-popup';
    popup.innerHTML = `
        <h3>${k.id}</h3>
        <p><strong>Region:</strong> ${k.region}</p>
        ${k.location ? `<p><strong>Location:</strong> ${k.location}</p>` : ''}
        ${k.puzzleType ? `<p><strong>Puzzle Type:</strong> ${k.puzzleType}</p>` : ''}
        <p><strong>Game Coordinates:</strong> X: ${k.gameX}, Y: ${k.gameY}</p>
        <p><strong>Map Coordinates:</strong> ${k.coordinates ? `X: ${Math.round(k.coordinates[0])}, Y: ${Math.round(k.coordinates[1])}` : 'N/A'}</p>
        <p><strong>Type:</strong> ${k.type}</p>
        <p>${k.description}</p>
        <button class="${k.found ? 'found' : ''}" data-id="${k.id}">${k.found ? 'Mark as Not Found' : 'Mark as Found'}</button>
    `;
    return popup;
}

// Update the addKorokMarkers function to use the new popup content
function addKorokMarkers() {
    markers.forEach(m => map.removeLayer(m));
    markers = [];
    korokData.forEach(k => {
        // Skip markers with missing or invalid coordinates
        if (!k.coordinates || !Array.isArray(k.coordinates) || k.coordinates.length < 2) {
            console.warn('Skipping marker with invalid coordinates:', k, JSON.stringify(k));
            return;
        }
        const marker = L.marker(k.coordinates, { 
            title: k.id, 
            icon: customKorokIcon,
            opacity: k.found ? 0.3 : 1.0,
            className: k.found ? 'marker-found' : ''
        });
        const popup = createPopupContent(k);
        marker.bindPopup(popup);
        marker.on('popupopen', () => {
            const btn = document.querySelector(`.korok-popup button[data-id="${k.id}"]`);
            if (btn) btn.addEventListener('click', () => toggleKorokFound(k.id));
        });
        marker.addTo(map);
        markers.push(marker);
    });
}

function toggleKorokFound(id) {
    const k = korokData.find(x => x.id === id);
    if (k) {
        k.found = !k.found;
        saveData();
        addKorokMarkers();
        updateStats();
        filterMarkers();
    }
}

function updateStats() {
    document.getElementById('found-count').textContent = korokData.filter(k => k.found).length;
    document.getElementById('total-count').textContent = korokData.length;
}

function filterMarkers() {
    const region = document.getElementById('region-filter').value;
    const location = document.getElementById('location-filter').value;
    const showFound = document.getElementById('show-found').checked;
    
    korokData.forEach((k, i) => {
        const regionMatch = region === 'all' || k.region === region;
        const locationMatch = location === 'all' || k.location === location;
        const match = (regionMatch && locationMatch) && (showFound || !k.found);
        
        if (match && !map.hasLayer(markers[i])) map.addLayer(markers[i]);
        else if (!match && map.hasLayer(markers[i])) map.removeLayer(markers[i]);
    });
}

function updateLocationFilter(region) {
    const locationFilter = document.getElementById('location-filter');
    locationFilter.innerHTML = '<option value="all">All Locations</option>';
    
    if (region === 'all') return;
    
    const locations = new Set();
    korokData.forEach(k => {
        if (k.region === region && k.location) {
            locations.add(k.location);
        }
    });
    
    locations.forEach(location => {
        const option = document.createElement('option');
        option.value = location;
        option.textContent = location;
        locationFilter.appendChild(option);
    });
}

function saveData() {
    localStorage.setItem('hyruleSurfaceMapData', JSON.stringify(korokData.map(k => ({ id: k.id, found: k.found }))));
}

function loadSavedData() {
    const data = localStorage.getItem('hyruleSurfaceMapData');
    if (data) JSON.parse(data).forEach(saved => {
        const k = korokData.find(k => k.id === saved.id);
        if (k) k.found = saved.found;
    });
}

const GERUDO_AFFINE = fitAffine2D(GERUDO_ANCHORS);

function gameToPixel(gameX, gameY, region) {
    // Use Gerudo region-specific calibration if region is 'Gerudo' or id starts with 'GE-'
    if (region === 'Gerudo' || (typeof region === 'undefined' && typeof gameX === 'string' && gameX.startsWith('GE-'))) {
        const [a, b, c, d, e, f] = GERUDO_AFFINE;
        const pixelY = a * gameX + b * gameY + c;
        const pixelX = d * gameX + e * gameY + f;
        return [pixelY, pixelX];
    }
    // Use NE region-specific calibration if region is 'Necluda' or id starts with 'NE-'
    if (region === 'Necluda' || (typeof region === 'undefined' && typeof gameX === 'string' && gameX.startsWith('NE-'))) {
        const [a, b, c, d, e, f] = NE_AFFINE;
        const pixelY = a * gameX + b * gameY + c;
        const pixelX = d * gameX + e * gameY + f;
        return [pixelY, pixelX];
    }
    // Use LA region-specific calibration if region is 'Lanayru' or id starts with 'LA-'
    // (If you have LA_AFFINE, add similar logic here)
    // Otherwise, use the original global calibration for all other regions
    // Reference points from the map:
    // Center:       HR-465 game [-254, 424] -> pixel [-1326, 1608]
    // Top Left:     HE-62  game [-4429, 3684] -> pixel [-236, 347]
    // Top Right:    AK-629 game [4541, 3162] -> pixel [-396, 3035]
    // Bottom Right: NE-880 game [4536, -3664] -> pixel [-2434, 3042]
    // Bottom Left:  GE-220 game [-4909, -1246] -> pixel [-2350, 325]
    const ref1GameX = -4429;  // HE-62 (Top Left)
    const ref1GameY = 3684;
    const ref1PixelX = 347;
    const ref1PixelY = -236;
    const ref2GameX = 4541;   // AK-629 (Top Right)
    const ref2GameY = 3162;
    const ref2PixelX = 3035;
    const ref2PixelY = -396;
    const xScale = (ref2PixelX - ref1PixelX) / (ref2GameX - ref1GameX);
    const yScale = (ref2PixelY - ref1PixelY) / (ref2GameY - ref1GameY);
    const pixelX = Math.round(ref1PixelX + (gameX - ref1GameX) * xScale);
    const pixelY = Math.round(ref1PixelY + (gameY - ref1GameY) * yScale);
    return [pixelY, pixelX];
}
